<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DRT Unified</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="">

    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon"><i data-lucide="shield-check"></i></div>
                <span>DRT Admin Portal</span>
            </div>
            <nav>
                <a href="/" class="nav-btn">Go to Chat</a>
            </nav>
            <label class="switch">
                <input id="theme-toggle" type="checkbox" checked>
                <span class="slider">
                    <div class="star star_1"></div>
                    <div class="star star_2"></div>
                    <div class="star star_3"></div>
                    <svg viewBox="0 0 16 16" class="cloud_1 cloud">
                        <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff" d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"></path>
                    </svg>
                </span>
            </label>
        </div>
    </header>

    <main>
        <!-- Admin View -->
        <section id="admin-view" class="view">
            <div class="admin-grid">
                <!-- Stores Column -->
                <div class="admin-col">
                    <div class="col-header">
                        <h2>Knowledge Stores</h2>
                        <button id="create-store-btn" class="icon-btn"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="store-list" class="store-list">
                        <!-- Stores list -->
                    </div>
                </div>

                <!-- Management Column -->
                <div class="admin-col main-col">
                    <div id="no-store-selected" class="empty-col">
                        <i data-lucide="database" class="big-icon"></i>
                        <p>Select a store to manage documents</p>
                    </div>

                    <div id="store-management" class="hidden">
                        <div class="store-header">
                            <h2 id="selected-store-name">Store Name</h2>
                            <span id="selected-store-id" class="id-badge">ID</span>
                        </div>

                        <div class="upload-section">
                            <div class="upload-card" id="drop-zone">
                                <i data-lucide="upload-cloud"></i>
                                <h3>Upload & Index Document</h3>
                                <p>Drag and drop or click to browse (PDF, TXT, DOCX)</p>
                                <input type="file" id="file-input" hidden>
                                <div id="upload-status" class="hidden">
                                     <div class="spinner"></div>
                                     <span id="status-text">Uploading...</span>
                                </div>
                            </div>
                        </div>

                        <div class="files-section">
                            <h3>Indexed Documents <span id="file-count" class="badge secondary hidden">0</span></h3>
                            <div id="file-list" class="file-table">
                                <!-- Files list -->
                            </div>
                            <div id="pagination-controls" class="pagination-area hidden">
                                <button id="next-page-btn" class="nav-btn secondary">Next Page</button>
                            </div>
                        </div>

                        <div class="danger-zone">
                            <p>Manage this Knowledge Store's lifecycle</p>
                            <button id="delete-store-btn" class="delete-link">
                                <i data-lucide="trash-2"></i>
                                Delete this entire Knowledge Store
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
